spring.application.name=trabalho1-cfm
spring.main.web-application-type=none

# MongoDB
spring.mongodb.uri=mongodb://root:root@localhost:27018/cfm?authSource=admin
spring.data.mongodb.uri=mongodb://root:root@localhost:27018/cfm?authSource=admin

# Etapa a executar: raspagem | etl | tudo
cfm.etapa=tudo

# Raspagem do portal https://portal.cfm.org.br/busca-medicos
cfm.ufs=PR,SC
cfm.paginas-por-uf=5
cfm.intervalo-entre-paginas-ms=2500
cfm.timeout-captcha-segundos=180

logging.level.org.mongodb.driver=warn